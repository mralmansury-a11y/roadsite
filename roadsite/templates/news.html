{% extends "base.html" %}{% block title %}الأخبار | {{ site.name }}{% endblock %}

<div class="page-h"><div class="wrap"><h1>الأخبار والإعلانات</h1></div></div>
<section class="s"><div class="wrap"><div class="grid">

</div></div></section>
{% endblock %}
